name: build

# Builds the Miyoo Mini image: bootstrap the repos with vcs2l, then run the
# buildroot build and upload the resulting images.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file wget cpio unzip rsync bzip2 \
            python3 python3-ply python3-pip \
            flex bison bc git pkg-config libssl-dev libyaml-dev \
            gcc-arm-linux-gnueabihf u-boot-tools
          pip3 install vcs2l

      - name: Bootstrap (vcs2l import)
        run: make bootstrap

      - name: Build
        run: make

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miyoomini-images
          path: buildroot/output/images/
          if-no-files-found: warn

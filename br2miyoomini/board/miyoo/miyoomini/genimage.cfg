image kernel.fit {
	fit {
		its = "../../../br2miyoomini/board/miyoo/miyoomini/kernel.its"
	}
}

# u-boot / kernel partition: a 256MB FAT holding the SPL, u-boot, its env
# and the kernel FIT image.
image boot_part.img {
	vfat {
		file uboot.env {
			image = "uboot-env.bin"
		}
		files = {
			ipl,
			u-boot.img,
			kernel.fit
		}
	}
	size = 256M
}

# SD card: one FAT boot partition followed by two 512MB A/B rootfs slots
# (both seeded with the same rootfs image).
image sdcard.img {
	hdimage {
	}
	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot_part.img"
		size = 256M
	}
	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 512M
	}
	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 512M
	}
}

image kernel.fit {
	fit {
		its = "../../../br2miyoomini/board/miyoo/miyoomini/kernel.its"
	}
}

# u-boot / kernel partition: a 256MB FAT holding the kernel FIT image.
# u-boot (ipl, u-boot.img) and its env are still deferred; once the u-boot
# package is wired back in, add them back to the files list here (and the
# "file uboot.env { image = "uboot-env.bin" }" entry).
image boot_part.img {
	vfat {
		files = {
			kernel.fit
		}
	}
	size = 256M
}

# SD card: one FAT boot partition followed by two 512MB A/B rootfs slots
# (both seeded with the same rootfs image).
image sdcard.img {
	hdimage {
	}
	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot_part.img"
		size = 256M
	}
	partition rootfs_a {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 512M
	}
	partition rootfs_b {
		partition-type = 0x83
		image = "rootfs.erofs"
		size = 512M
	}
}
